[package]
name = "vox-core"
version = "0.10.0-rc.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Core implementations for Vox connections, lanes, drivers, and links"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[features]
default = []
diagnostics = []

[dependencies]
# Registry (NOT workspace-path) versions of the vox siblings, on this
# branch only: this crate is the one a consumer patches in for
# `Caller::with_global_middleware`, and a path dep here would drag the
# whole worktree in with it — including a vox-phon that has moved past
# the published rc.5 phon. Registry deps keep the patch surface to
# exactly the crate that changed.
vox-types = "0.10.0-rc.5"
facet.workspace = true
facet-core.workspace = true
vox-phon = "0.10.0-rc.5"
vox-rt = "0.10.0-rc.5"
tracing.workspace = true
zerocopy.workspace = true
futures-util.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
facet-testhelpers.workspace = true
tracing-subscriber = { workspace = true }
